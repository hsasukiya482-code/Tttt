name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "FINDING TEST MITRA ZIP"
          echo "================================="

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP EXTRACTED SUCCESSFULLY."

      - name: Detect Project
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "DETECTING PROJECT"
          echo "================================="

          PACKAGE_FILE=$(find extracted -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          WEB_DIR=$(dirname "$PACKAGE_FILE")

          echo "WEB PROJECT:"
          echo "$WEB_DIR"

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            ANDROID_DIR=$(dirname "$SETTINGS_FILE")

            echo "ANDROID PROJECT:"
            echo "$ANDROID_DIR"

            echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        working-directory: ${{ env.WEB_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "INSTALLING NPM DEPENDENCIES"
          echo "================================="

          npm install

      - name: Build Web App
        working-directory: ${{ env.WEB_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "BUILDING WEB APP"
          echo "================================="

          npm run build

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ANDROID_DIR"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Gradle Wrapper
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

          echo "Gradle wrapper ready."

      - name: Enable AndroidX
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "ENABLING ANDROIDX"
          echo "================================="

          touch gradle.properties

          grep -qxF "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -qxF "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

          echo ""
          echo "gradle.properties:"
          cat gradle.properties

      - name: Fix Android Manifest
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Fixing AndroidManifest..."

          sed -i 's/android:icon="@mipmap\/ic_launcher"//g' "$MANIFEST"
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//g' "$MANIFEST"

          sed -i 's#android:theme="@style/Theme.TestMitra"#android:theme="@android:style/Theme.Material.Light.NoActionBar"#g' "$MANIFEST"

          echo "AndroidManifest fixed."

      - name: Check Android Project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "CHECKING ANDROID PROJECT"
          echo "================================="

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          echo "Android project is ready."

      - name: Clean Project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          ./gradlew clean --no-daemon

      - name: Build TEST MITRA APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "BUILDING TEST MITRA APK"
          echo "================================="

          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "SEARCHING APK"
          echo "================================="

          find "$ANDROID_DIR" -type f -name "*.apk" -print

          APK=$(find "$ANDROID_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK SUCCESSFULLY GENERATED:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
