name: Build Test Mitra APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "FINDING TEST MITRA ZIP"
          echo "================================="

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          echo "================================="
          echo "EXTRACTING ZIP"
          echo "================================="

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP EXTRACTED."

          echo "================================="
          echo "SEARCHING FOR GRADLE PROJECT"
          echo "================================="

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP."
            echo ""
            echo "Files inside ZIP:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "ANDROID/GRADLE PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Project Structure
        shell: bash
        run: |
          echo "================================="
          echo "PROJECT STRUCTURE"
          echo "================================="

          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""

          ls -la "$PROJECT_DIR"

          echo ""

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "WARNING: app folder not directly found."
            echo "Searching for app folder..."

            APP_DIR=$(find "$PROJECT_DIR" -type d -name "app" | head -n 1)

            if [ -z "$APP_DIR" ]; then
              echo "ERROR: Android app folder not found."
              exit 1
            fi

            echo "APP FOUND:"
            echo "$APP_DIR"

            echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          else
            echo "APP FOUND:"
            echo "$PROJECT_DIR/app"

            echo "APP_DIR=$PROJECT_DIR/app" >> "$GITHUB_ENV"
          fi

      - name: Fix AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"

          echo "================================="
          echo "CHECKING ANDROID MANIFEST"
          echo "================================="

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            echo "Searching..."

            MANIFEST=$(find "$APP_DIR" -type f -name "AndroidManifest.xml" | head -n 1)

            if [ -z "$MANIFEST" ]; then
              echo "ERROR: AndroidManifest.xml does not exist."
              exit 1
            fi
          fi

          echo "MANIFEST:"
          echo "$MANIFEST"

          echo ""
          echo "Fixing missing launcher resources..."

          sed -i 's/android:icon="@mipmap\/ic_launcher"//g' "$MANIFEST"
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//g' "$MANIFEST"

          sed -i 's#android:theme="@style/Theme.TestMitra"#android:theme="@android:style/Theme.Material.Light.NoActionBar"#g' "$MANIFEST"

          echo ""
          echo "MANIFEST AFTER FIX:"
          cat "$MANIFEST"

      - name: Make Gradle Executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Clean Project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "================================="
          echo "BUILDING TEST MITRA APK"
          echo "================================="

          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "================================="
          echo "SEARCHING APK"
          echo "================================="

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK SUCCESSFULLY GENERATED:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
