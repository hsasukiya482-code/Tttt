name: Build Test Mitra APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Test Mitra APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Project Structure
        shell: bash
        run: |
          echo "========== PROJECT =========="
          pwd
          echo ""
          echo "========== ROOT FILES =========="
          ls -la
          echo ""
          echo "========== ANDROID FOLDER =========="
          if [ -d "android" ]; then
            ls -la android
          else
            echo "ERROR: android folder not found"
            exit 1
          fi
          echo ""
          echo "========== GRADLE =========="
          if [ -f "android/gradlew" ]; then
            echo "android/gradlew FOUND"
          else
            echo "ERROR: android/gradlew NOT FOUND"
            exit 1
          fi

      - name: Fix AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          echo "Fixing AndroidManifest..."

          sed -i 's/android:icon="@mipmap\/ic_launcher"//g' "$MANIFEST"
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//g' "$MANIFEST"

          sed -i 's#android:theme="@style/Theme.TestMitra"#android:theme="@android:style/Theme.Material.Light.NoActionBar"#g' "$MANIFEST"

          echo "Manifest fixed."

      - name: Make Gradle Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Clean Gradle
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          echo "========== APK FILES =========="

          find android/app/build/outputs -type f -name "*.apk" -print

          APK_COUNT=$(find android/app/build/outputs -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK BUILD SUCCESSFUL."

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
