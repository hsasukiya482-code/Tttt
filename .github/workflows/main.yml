name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extracted/package.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      - name: Detect Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          ANDROID_DIR=$(find extracted -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find extracted -maxdepth 5 -type f | head -300
            exit 1
          fi

          ANDROID_DIR=$(dirname "$ANDROID_DIR")

          echo "ANDROID PROJECT:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          if [ -f "extracted/package.json" ]; then
            echo "WEB PROJECT FOUND"
            echo "WEB_DIR=extracted" >> "$GITHUB_ENV"
          fi

      - name: Install NPM Dependencies
        if: ${{ env.WEB_DIR != '' }}
        working-directory: extracted
        shell: bash
        run: |
          set -e

          echo "Installing npm dependencies..."

          npm install

      - name: Capacitor Sync
        if: ${{ env.WEB_DIR != '' }}
        working-directory: extracted
        shell: bash
        run: |
          set -e

          echo "Running Capacitor sync..."

          npx cap sync android

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Gradle Wrapper
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "Creating Gradle wrapper..."

          gradle wrapper --gradle-version 8.7

          chmod +x gradlew

          echo "Gradle wrapper created."

      - name: Fix Android Resources
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Fixing AndroidManifest..."

          sed -i 's/android:icon="@mipmap\/ic_launcher"//g' "$MANIFEST"
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//g' "$MANIFEST"

          sed -i 's#android:theme="@style/Theme.TestMitra"#android:theme="@android:style/Theme.Material.Light.NoActionBar"#g' "$MANIFEST"

          echo "Manifest fixed."

      - name: Check Gradle Project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          echo "========== ANDROID PROJECT =========="

          ls -la

          echo ""

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew was not created."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          echo "Android project is ready."

      - name: Clean Android Project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          ./gradlew clean --no-daemon

      - name: Build TEST MITRA APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "BUILDING TEST MITRA APK"
          echo "================================="

          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "========== APK FILES =========="

          find "$ANDROID_DIR" -type f -name "*.apk" -print

          APK=$(find "$ANDROID_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK SUCCESSFULLY GENERATED:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
